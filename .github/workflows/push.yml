name: "publicacion web"
run-name: "publicacion web"
on: [push] 
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar pnpm (lee la versión declarada en package.json "packageManager" si existe)
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # O la versión específica de pnpm que utilices

      # 3. Configurar Node.js con caché de pnpm integrada
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      # 4. Instalar dependencias usando pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. Construir el proyecto Astro
      - name: Build site
        run: pnpm build