name: "publicacion web"
run-name: "publicacion web"
on: [push] 
permissions:
  contents: write
  actions: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Instalar pnpm (lee la versión declarada en package.json "packageManager" si existe)
      - name: Install pnpm
        uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: "Corregir nombres de carpetas y referencias (_astro -> astro)"
        run: |
          if [ -d "docs/_astro" ]; then
            mv docs/_astro docs/astro
          fi
          find docs -type f -name "*.html" -exec sed -i 's/\/_astro\//\/astro\//g' {} +
      - name: "Guardar cambios en docs"
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs 